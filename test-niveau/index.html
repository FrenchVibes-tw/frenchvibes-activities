<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>What's my French level? · FrenchVibes Academy</title>
<style>
:root{
  --text:#2C2C2B;--muted:#7D7A75;--canvas:#FFFFFF;--soft:#F9F8F7;--surface2:#F0EFED;
  --border:#E6E5E3;--blue:#2783DE;--blue-soft:#E5F2FC;--blue-line:#CFE6F9;
  --green:#46A171;--green-soft:#E8F1EC;--violet:#7C3AED;
}
@media (prefers-color-scheme: dark){
  :root{
    --text:#FFFFFF;--muted:rgba(255,255,255,.65);--canvas:#202020;--soft:#191919;--surface2:#383836;
    --border:rgba(255,255,255,.20);--blue:#5E9FE8;--blue-soft:rgba(94,159,232,.12);--blue-line:rgba(94,159,232,.35);
    --green:#72BC8F;--green-soft:rgba(114,188,143,.12);--violet:#C4B5FD;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--soft);color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:20px 20px 26px}
.card{background:var(--canvas);border:1px solid var(--border);border-radius:14px;padding:28px}
h1{font-size:29px;line-height:1.2;margin:0 0 10px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px;padding:0;list-style:none}
.chip{background:var(--surface2);border-radius:999px;padding:6px 12px;font-size:14px}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:600;min-height:48px;
  padding:12px 22px;border-radius:10px;background:var(--blue);color:#fff;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(.94)}
.btn.secondary{background:var(--surface2);color:var(--text)}
.btn.ghost{background:transparent;color:var(--muted);font-weight:500;text-decoration:underline;padding:10px 2px;min-height:44px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.qmeta{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:0 0 14px;font-weight:600}
.instr{font-size:14px;color:var(--muted);margin:0 0 12px}
.ctx{background:var(--soft);border:1px solid var(--border);border-left:3px solid var(--blue);
  border-radius:8px;padding:12px 14px;margin:0 0 14px;white-space:pre-line}
.stem{font-size:21px;line-height:1.45;margin:0 0 18px;font-weight:500}
.stem .gap{color:var(--blue);font-weight:700;letter-spacing:.05em}
.ask{margin:0 0 16px;font-weight:600}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--canvas);border:1px solid var(--border);border-radius:10px;
  padding:13px 16px;min-height:48px;font:inherit;color:var(--text);cursor:pointer;
  display:flex;align-items:center;gap:12px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--blue);background:var(--blue-soft)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt .k{font-size:12px;color:var(--muted);min-width:16px;font-weight:700}
.dunno{margin-top:14px;background:transparent;border:1px dashed var(--border);color:var(--muted);
  border-radius:10px;padding:12px 16px;min-height:48px;font:inherit;cursor:pointer;width:100%;text-align:center}
.dunno:hover{border-color:var(--blue);color:var(--blue)}
input[type=text]{width:100%;font:inherit;padding:13px 14px;border:1px solid var(--border);
  border-radius:10px;background:var(--canvas);color:var(--text);min-height:48px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.hint{font-size:13px;color:var(--muted);margin-top:10px}
.tokens{display:flex;flex-wrap:wrap;gap:8px}
.tok{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;
  min-height:44px;font:inherit;color:var(--text);cursor:pointer}
.tok:hover{border-color:var(--blue)}
.tok[disabled]{opacity:.3;cursor:default}
.build{min-height:58px;border:1px dashed var(--border);border-radius:10px;padding:9px;display:flex;
  flex-wrap:wrap;gap:8px;align-items:center;background:var(--soft);margin:0 0 12px}
.build .ph{color:var(--muted);font-size:14px;padding-left:6px}
.bt{background:var(--blue-soft);border:1px solid var(--blue);color:var(--text);border-radius:8px;
  padding:9px 13px;min-height:42px;font:inherit;cursor:pointer}
.tracker{margin:0 0 14px}
#pathwrap svg{display:block;width:100%;height:auto}
.seg{fill:none;stroke:var(--border);stroke-width:7;stroke-linecap:round}
.seg.done{stroke:var(--green)}
.seg.now{stroke:var(--blue)}
.seg.skip{stroke-dasharray:2 13}
.dot{fill:var(--border)}
.dot.done{fill:var(--blue)}
.dot.cur{fill:var(--blue)}
.dot.skip{fill:var(--canvas);stroke:var(--border);stroke-width:2}
.ring{fill:none;stroke:var(--blue);stroke-width:3;opacity:.3}
.ms{fill:var(--canvas);stroke:var(--border);stroke-width:3}
.ms.done{fill:var(--green-soft);stroke:var(--green)}
.ms.now{fill:var(--blue-soft);stroke:var(--blue)}
.mslab{font-size:15px;font-weight:700;fill:var(--muted);text-anchor:middle}
.mslab.done{fill:var(--green)}
.mslab.now{fill:var(--blue)}
.msicon{font-size:19px;text-anchor:middle;dominant-baseline:central}
.startlab{font-size:13px;fill:var(--muted);text-anchor:middle}
.mini{display:none;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.mstone{font-size:13px;padding:6px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.mstone.done{background:var(--green-soft);color:var(--green);font-weight:700}
.mstone.now{background:var(--blue-soft);color:var(--blue);font-weight:700}
.mdots{display:flex;gap:6px;margin-left:4px}
.mdot{width:9px;height:9px;border-radius:50%;background:var(--border)}
.mdot.done{background:var(--blue)}
.mdot.now{background:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.stagemeta{text-align:center;font-size:13px;color:var(--muted);margin:10px 0 0;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:10px;background:var(--green-soft);color:var(--green);
  font-weight:700;border-radius:999px;padding:8px 16px;font-size:15px;margin:0 0 14px}
.rtitle{font-size:25px;line-height:1.25;margin:0 0 10px}
.panel{background:var(--soft);border:1px solid var(--border);border-radius:12px;padding:18px;margin:0 0 16px}
.panel h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.panel ul{margin:0;padding-left:20px}
.panel li{margin:0 0 6px}
.panel li:last-child{margin:0}
.cta{background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:12px;padding:20px;margin:0 0 16px}
.cta h3{margin:0 0 8px;font-size:19px}
.cta p{margin:0 0 14px}
.cta p:last-of-type{margin:0 0 16px}
.kofi{color:var(--violet);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px;border-radius:4px}
.kofi:hover{background:rgba(124,58,237,.10)}
.kofi:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.note{font-size:13px;color:var(--muted);margin:0}
.celebrate{text-align:center;padding:10px 0 4px}
.celebrate .big{font-size:52px;line-height:1;margin:0 0 14px}
.foot{text-align:center;font-size:12px;color:var(--muted);margin:16px 0 0}
@media(max-width:560px){
  .wrap{padding:16px 16px 22px}.card{padding:20px}h1{font-size:23px}.rtitle{font-size:21px}
  .stem{font-size:19px}#pathwrap{display:none}.mini{display:flex}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="tracker" id="tracker" hidden>
    <div id="pathwrap"></div>
    <div class="mini" id="mini"></div>
    <p class="stagemeta" id="stagemeta"></p>
  </div>
  <main class="card" id="screen" aria-live="polite"></main>
  <p class="foot">FrenchVibes Academy - A quick estimate to point you in the right direction. This is not an official exam.</p>
</div>
<script>
/* FrenchVibes Academy - level test question bank
   4 stages (A1, A2, B1, B2) x 5 CEFR aspects x 10 questions = 200 questions.
   Each round uses 2 questions per aspect (10 per stage) => 5 rounds with no repeats. */
var BANK = {
A1: [
{id:"a1v1",aspect:"vocab",format:"mcq",instr:"Complete the sentence.",stem:"Je voudrais un ___, s'il vous plaît.",options:["café","baguette","pomme","glace"],answer:"café"},
{id:"a1v2",aspect:"vocab",format:"type",instr:"Write the missing French word.",stem:"You are thirsty. You ask for a glass of ___ (water).",accept:["eau","l'eau","de l'eau","d'eau"]},
{id:"a1v3",aspect:"vocab",format:"mcq",instr:"Which word is a colour?",options:["rouge","roue","rue","route"],answer:"rouge"},
{id:"a1v4",aspect:"vocab",format:"mcq",instr:"What is this sentence about?",stem:"Il fait très chaud aujourd'hui.",options:["The weather","The price","A family member","The time"],answer:"The weather"},
{id:"a1v5",aspect:"vocab",format:"type",instr:"Write the number in French words.",stem:"7 = ___",accept:["sept"]},
{id:"a1v6",aspect:"vocab",format:"mcq",instr:"Complete the sentence.",stem:"Mon père et ma mère sont mes ___.",options:["parents","enfants","voisins","collègues"],answer:"parents"},
{id:"a1v7",aspect:"vocab",format:"type",instr:"Write the missing French word.",stem:"At the bakery: « Une baguette, s'il vous ___. »",accept:["plaît","plait"]},
{id:"a1v8",aspect:"vocab",format:"mcq",instr:"Which one means « a book »?",options:["un livre","une lettre","un lit","une liste"],answer:"un livre"},
{id:"a1v9",aspect:"vocab",format:"mcq",instr:"Which day comes after « lundi »?",options:["mardi","dimanche","samedi","vendredi"],answer:"mardi"},
{id:"a1v10",aspect:"vocab",format:"type",instr:"Write the number in French words.",stem:"12 = ___",accept:["douze"]},

{id:"a1g1",aspect:"grammar",format:"mcq",instr:"Choose the correct form.",stem:"Je ___ français.",options:["parle","parles","parlons","parlez"],answer:"parle"},
{id:"a1g2",aspect:"grammar",format:"mcq",instr:"Choose the correct subject pronoun.",stem:"___ s'appelle Marie.",options:["Elle","Ils","Nous","Vous"],answer:"Elle"},
{id:"a1g3",aspect:"grammar",format:"mcq",instr:"Choose the correct form of « avoir ».",stem:"Nous ___ deux enfants.",options:["avons","avez","ont","êtes"],answer:"avons"},
{id:"a1g4",aspect:"grammar",format:"type",instr:"Complete with the verb « être ».",stem:"Tu ___ étudiant.",accept:["es","tu es"]},
{id:"a1g5",aspect:"grammar",format:"mcq",instr:"Choose the correct negative form.",stem:"Je ___ pas de frère.",options:["n'ai","ai","suis","n'est"],answer:"n'ai"},
{id:"a1g6",aspect:"grammar",format:"mcq",instr:"Choose the correct form.",stem:"Elle ___ à Taipei.",options:["habite","habites","habitent","habitez"],answer:"habite"},
{id:"a1g7",aspect:"grammar",format:"mcq",instr:"Choose the correct question word.",stem:"___ est ton nom ?",options:["Quel","Quelle","Qui","Où"],answer:"Quel"},
{id:"a1g8",aspect:"grammar",format:"type",instr:"Complete with the verb « avoir ».",stem:"J'___ vingt ans.",accept:["ai","j'ai"]},
{id:"a1g9",aspect:"grammar",format:"mcq",instr:"Choose the correct article.",stem:"C'est ___ amie de Paul.",options:["une","un","des","le"],answer:"une"},
{id:"a1g10",aspect:"grammar",format:"mcq",instr:"Choose the correct form of « être ».",stem:"Nous ___ étudiants.",options:["sommes","est","ont","avez"],answer:"sommes"},

{id:"a1r1",aspect:"reading",format:"mcq",instr:"Read the short dialogue.",ctx:"— Bonjour, vous vous appelez comment ?\n— Je m'appelle Léa Martin.",ask:"What is the second person doing?",options:["Giving their name","Giving their age","Ordering a drink","Asking the time"],answer:"Giving their name"},
{id:"a1r2",aspect:"reading",format:"mcq",instr:"Read the short dialogue.",ctx:"— Un café et un croissant, s'il vous plaît.\n— Ça fait 4 euros 50.",ask:"Where are these people?",options:["In a café","At the doctor","At school","In a taxi"],answer:"In a café"},
{id:"a1r3",aspect:"reading",format:"mcq",instr:"Read the short dialogue.",ctx:"— Tu habites où ?\n— À Taipei, avec ma sœur.",ask:"Who does this person live with?",options:["Their sister","Their brother","Their mother","Nobody"],answer:"Their sister"},
{id:"a1r4",aspect:"reading",format:"mcq",instr:"Read the short dialogue.",ctx:"— Il est quelle heure ?\n— Il est huit heures et demie.",ask:"What time is it?",options:["8:30","8:15","9:30","7:30"],answer:"8:30"},
{id:"a1r5",aspect:"reading",format:"mcq",instr:"Read this short introduction.",ctx:"Salut ! Je m'appelle Marc, j'ai 25 ans et je suis professeur de sport.",ask:"What is his job?",options:["Sports teacher","Student","Doctor","Cook"],answer:"Sports teacher"},
{id:"a1r6",aspect:"reading",format:"mcq",instr:"Read the short dialogue.",ctx:"— Vous voulez boire quelque chose ?\n— Oui, un verre d'eau, s'il vous plaît.",ask:"What does the person want?",options:["A glass of water","A coffee","Nothing","The menu"],answer:"A glass of water"},
{id:"a1r7",aspect:"reading",format:"mcq",instr:"Read this introduction.",ctx:"Bonjour, je m'appelle Chloé. Je suis française, mais j'habite à Taipei depuis trois ans.",ask:"Where does Chloé live?",options:["In Taipei","In France","In Japan","She doesn't say"],answer:"In Taipei"},
{id:"a1r8",aspect:"reading",format:"mcq",instr:"Read the short dialogue.",ctx:"— Le train part à quelle heure ?\n— À dix heures dix, quai numéro 4.",ask:"Which platform is the train on?",options:["4","10","14","No platform is given"],answer:"4"},
{id:"a1r9",aspect:"reading",format:"mcq",instr:"Read this text message.",ctx:"Je suis en retard, j'arrive dans dix minutes !",ask:"What is happening?",options:["The person will arrive late","The person cancels","The person is early","The person is lost"],answer:"The person will arrive late"},
{id:"a1r10",aspect:"reading",format:"mcq",instr:"Read the short dialogue.",ctx:"— Tu as des frères et sœurs ?\n— Oui, deux frères, mais pas de sœur.",ask:"How many sisters does this person have?",options:["None","One","Two","Three"],answer:"None"},

{id:"a1u1",aspect:"usage",format:"mcq",instr:"Someone says « Merci beaucoup ! » What do you answer?",options:["De rien","S'il vous plaît","Bonjour","Au revoir"],answer:"De rien"},
{id:"a1u2",aspect:"usage",format:"mcq",instr:"You walk into a shop in the morning. What do you say?",options:["Bonjour","Bonne nuit","Bon appétit","Bienvenue"],answer:"Bonjour"},
{id:"a1u3",aspect:"usage",format:"mcq",instr:"You want to know the price. What do you ask?",options:["C'est combien ?","C'est où ?","C'est qui ?","C'est quand ?"],answer:"C'est combien ?"},
{id:"a1u4",aspect:"usage",format:"mcq",instr:"Someone asks you « Ça va ? » What is a natural answer?",options:["Ça va bien, merci","Il est trois heures","J'ai 30 ans","Je m'appelle Paul"],answer:"Ça va bien, merci"},
{id:"a1u5",aspect:"usage",format:"mcq",instr:"Complete this polite order in a café.",stem:"Un thé, ___",options:["s'il vous plaît","de rien","à bientôt","bonne nuit"],answer:"s'il vous plaît"},
{id:"a1u6",aspect:"usage",format:"mcq",instr:"You leave a shop in the evening. What do you say?",options:["Au revoir, bonne soirée !","Bonjour !","Bon appétit !","Enchanté !"],answer:"Au revoir, bonne soirée !"},
{id:"a1u7",aspect:"usage",format:"mcq",instr:"You meet someone for the very first time. What do you say?",options:["Enchanté !","À demain !","Bon voyage !","Désolé !"],answer:"Enchanté !"},
{id:"a1u8",aspect:"usage",format:"mcq",instr:"You didn't hear the price. What do you ask?",options:["Pardon, c'est combien ?","C'est fini ?","C'est loin ?","C'est bon ?"],answer:"Pardon, c'est combien ?"},
{id:"a1u9",aspect:"usage",format:"mcq",instr:"At the table, just before eating, French people say…",options:["Bon appétit !","Bonne nuit !","Bon courage !","Bonne route !"],answer:"Bon appétit !"},
{id:"a1u10",aspect:"usage",format:"mcq",instr:"You are looking for the toilets in a restaurant. What do you ask?",options:["Où sont les toilettes, s'il vous plaît ?","Qu'est-ce que c'est ?","Combien ça coûte ?","Quelle heure est-il ?"],answer:"Où sont les toilettes, s'il vous plaît ?"},

{id:"a1s1",aspect:"structure",format:"order",instr:"Put the words in the correct order.",tokens:["Je","suis","professeur","de","français"],answers:["Je suis professeur de français"]},
{id:"a1s2",aspect:"structure",format:"order",instr:"Put the words in the correct order.",tokens:["Tu","habites","à","Paris"],answers:["Tu habites à Paris"]},
{id:"a1s3",aspect:"structure",format:"mcq",instr:"Which word is the verb?",stem:"Marie mange une pomme.",options:["mange","Marie","une","pomme"],answer:"mange"},
{id:"a1s4",aspect:"structure",format:"mcq",instr:"What is the subject of this sentence?",stem:"Les enfants sont à l'école.",options:["Les enfants","sont","à","l'école"],answer:"Les enfants"},
{id:"a1s5",aspect:"structure",format:"order",instr:"Put the words in the correct order.",tokens:["Nous","avons","deux","chats"],answers:["Nous avons deux chats"]},
{id:"a1s6",aspect:"structure",format:"order",instr:"Put the words in the correct order.",tokens:["Elle","habite","dans","une","grande","maison"],answers:["Elle habite dans une grande maison"]},
{id:"a1s7",aspect:"structure",format:"mcq",instr:"Which word is the verb?",stem:"Les enfants jouent dans le parc.",options:["jouent","enfants","parc","dans"],answer:"jouent"},
{id:"a1s8",aspect:"structure",format:"order",instr:"Put the words in the correct order.",tokens:["Je","n'aime","pas","le","fromage"],answers:["Je n'aime pas le fromage"]},
{id:"a1s9",aspect:"structure",format:"mcq",instr:"What is the subject of this sentence?",stem:"Mon frère travaille à Paris.",options:["Mon frère","travaille","à","Paris"],answer:"Mon frère"},
{id:"a1s10",aspect:"structure",format:"order",instr:"Put the words in the correct order.",tokens:["Vous","avez","un","stylo"],answers:["Vous avez un stylo"]}
],

A2: [
{id:"a2v1",aspect:"vocab",format:"mcq",instr:"Complete the sentence.",stem:"Hier, j'étais très ___ : j'ai travaillé douze heures.",options:["fatigué","tôt","souvent","prêt"],answer:"fatigué"},
{id:"a2v2",aspect:"vocab",format:"type",instr:"Write the opposite of « toujours ».",stem:"toujours ≠ ___",accept:["jamais","ne jamais"]},
{id:"a2v3",aspect:"vocab",format:"mcq",instr:"What does this sentence mean?",stem:"J'ai assisté à la réunion.",options:["I attended the meeting","I helped during the meeting","I insisted on the meeting","I missed the meeting"],answer:"I attended the meeting"},
{id:"a2v4",aspect:"vocab",format:"mcq",instr:"Which one is a household chore?",options:["faire la vaisselle","faire la fête","faire du vélo","faire la queue"],answer:"faire la vaisselle"},
{id:"a2v5",aspect:"vocab",format:"type",instr:"Write the missing place.",stem:"Je vais à la ___ pour acheter du pain.",accept:["boulangerie","la boulangerie"]},
{id:"a2v6",aspect:"vocab",format:"mcq",instr:"Complete the sentence.",stem:"Il y a une grève, donc les trains sont ___.",options:["annulés","gratuits","rapides","ouverts"],answer:"annulés"},
{id:"a2v7",aspect:"vocab",format:"type",instr:"Write the opposite of « facile ».",stem:"facile ≠ ___",accept:["difficile","dur","compliqué"]},
{id:"a2v8",aspect:"vocab",format:"mcq",instr:"What does « avoir besoin de » mean?",options:["To need","To be able to","To be in a hurry","To be bored"],answer:"To need"},
{id:"a2v9",aspect:"vocab",format:"mcq",instr:"Which one is about health?",options:["prendre rendez-vous chez le médecin","faire les courses","prendre le bus","ranger la chambre"],answer:"prendre rendez-vous chez le médecin"},
{id:"a2v10",aspect:"vocab",format:"type",instr:"Write the missing place.",stem:"Je suis allé à la ___ pour envoyer une lettre.",accept:["poste","la poste"]},

{id:"a2g1",aspect:"grammar",format:"mcq",instr:"Choose the correct past form.",stem:"Hier, je ___ au cinéma.",options:["suis allé","ai allé","vais","allais"],answer:"suis allé"},
{id:"a2g2",aspect:"grammar",format:"mcq",instr:"Choose the correct auxiliary.",stem:"Elle ___ née en 1990.",options:["est","a","avait","sera"],answer:"est"},
{id:"a2g3",aspect:"grammar",format:"type",instr:"Put the verb in the passé composé.",stem:"Nous ___ (manger) au restaurant.",accept:["avons mangé","nous avons mangé"]},
{id:"a2g4",aspect:"grammar",format:"mcq",instr:"Choose the correct pronoun.",ctx:"— Tu aimes le chocolat ?\n— Oui, je ___ adore !",options:["l'","le","lui","y"],answer:"l'"},
{id:"a2g5",aspect:"grammar",format:"mcq",instr:"Choose the correct form (near future).",stem:"Demain, je ___ voir mes amis.",options:["vais","vas","allons","allez"],answer:"vais"},
{id:"a2g6",aspect:"grammar",format:"mcq",instr:"Choose the correct past form.",stem:"Quand j'étais petit, je ___ souvent au parc.",options:["allais","suis allé","irai","aille"],answer:"allais"},
{id:"a2g7",aspect:"grammar",format:"mcq",instr:"Choose the correct form.",stem:"Il y a beaucoup ___ monde dans le métro.",options:["de","du","des","le"],answer:"de"},
{id:"a2g8",aspect:"grammar",format:"type",instr:"Put the verb in the passé composé.",stem:"Elle ___ (partir) hier soir.",accept:["est partie","elle est partie"]},
{id:"a2g9",aspect:"grammar",format:"mcq",instr:"Choose the correct comparative.",stem:"Ce livre est ___ intéressant que l'autre.",options:["plus","très","beaucoup","trop"],answer:"plus"},
{id:"a2g10",aspect:"grammar",format:"mcq",instr:"Choose the correct negative word.",stem:"Je suis végétarien : je ne mange ___ de viande.",options:["jamais","toujours","souvent","déjà"],answer:"jamais"},

{id:"a2r1",aspect:"reading",format:"mcq",instr:"Read this message.",ctx:"Salut Léa ! Je suis désolé, je ne peux pas venir dimanche, je dois travailler. On peut se voir lundi ?",ask:"Why can't he come on Sunday?",options:["He has to work","He is sick","He is travelling","He forgot"],answer:"He has to work"},
{id:"a2r2",aspect:"reading",format:"mcq",instr:"Read the short dialogue.",ctx:"— Tu as passé un bon week-end ?\n— Bof. Il a plu tout le temps, alors on est restés à la maison.",ask:"What did they do?",options:["They stayed home because of the rain","They went hiking","They visited family","They went to the beach"],answer:"They stayed home because of the rain"},

{id:"a2r7",aspect:"reading",format:"mcq",instr:"Read the short dialogue.",ctx:"— Comment tu es venu ?\n— En métro. La voiture est chez le garagiste.",ask:"Why didn't he drive?",options:["His car is being repaired","He has no licence","He prefers the metro","The car is too small"],answer:"His car is being repaired"},

{id:"b2g8",aspect:"grammar",format:"type",instr:"Put the verb in the passé du subjonctif.",stem:"Je regrette qu'il ___ (partir) si vite.",accept:["soit parti","il soit parti"]},
{id:"b2g9",aspect:"grammar",format:"mcq",instr:"Choose the correct form.",stem:"Il parle comme s'il ___ tout compris.",options:["avait","a","aura","ait"],answer:"avait"},
{id:"b2g10",aspect:"grammar",format:"mcq",instr:"Choose the correct agreement.",stem:"Les décisions qu'il a ___ étaient courageuses.",options:["prises","pris","prise","prendre"],answer:"prises"},

{id:"b2r1",aspect:"reading",format:"mcq",instr:"Read this extract.",ctx:"Certes, les chiffres progressent. Il n'en reste pas moins que la situation demeure fragile.",ask:"What is the author's position?",options:["Progress is real, but the situation is still fragile","The situation is fragile because the figures are falling","The author doubts the figures are really improving","The fragility is behind us, even if progress is slow"],answer:"Progress is real, but the situation is still fragile"},
{id:"b2r2",aspect:"reading",format:"mcq",instr:"Read this extract.",ctx:"L'auteur, non sans ironie, qualifie cette réforme de « révolution ».",ask:"What does the author think of the reform?",options:["He is not convinced it is truly revolutionary","He sincerely believes it is a real revolution","He thinks it goes too far to be called a reform","He regrets that the reform was never applied"],answer:"He is not convinced it is truly revolutionary"},
{id:"b2r3",aspect:"reading",format:"mcq",instr:"Read this extract.",ctx:"Loin de résoudre le problème, cette mesure risque de l'aggraver.",ask:"What is being said about the measure?",options:["It could make the problem worse","It solves part of the problem, but not all of it","It has already made the situation worse","It was designed to make the problem worse"],answer:"It could make the problem worse"},
{id:"b2r4",aspect:"reading",format:"mcq",instr:"Read this extract.",ctx:"Il aura fallu dix ans pour que ce projet voie enfin le jour.",ask:"What does this sentence say?",options:["The project finally happened, after ten years","The project will need ten more years to happen","After ten years, the project was finally abandoned","The project happened earlier than planned"],answer:"The project finally happened, after ten years"},
{id:"b2r5",aspect:"reading",format:"mcq",instr:"Read this extract.",ctx:"Quand bien même les moyens seraient réunis, le calendrier resterait intenable.",ask:"What does the author mean?",options:["Even with the resources, the schedule would not hold","The schedule fails only because resources are missing","Once the resources arrive, the schedule will hold","The schedule held, thanks to the extra resources"],answer:"Even with the resources, the schedule would not hold"},
{id:"b2r6",aspect:"reading",format:"mcq",instr:"Read this extract.",ctx:"Cette hypothèse, pour séduisante qu'elle soit, ne résiste pas à l'analyse.",ask:"What does the writer think?",options:["It is attractive, but it does not hold up","It holds up precisely because it is attractive","It is neither attractive nor worth analysing","It has not yet been seriously analysed"],answer:"It is attractive, but it does not hold up"},
{id:"b2r7",aspect:"reading",format:"mcq",instr:"Read this extract carefully.",ctx:"Il n'aura échappé à personne que les chiffres ont été soigneusement choisis.",ask:"What is implied?",options:["Everyone can see the figures were carefully picked","Nobody noticed how the figures were chosen","The figures were chosen without any real care","The author admits choosing the figures himself"],answer:"Everyone can see the figures were carefully picked"},
{id:"b2r8",aspect:"reading",format:"mcq",instr:"Read this extract.",ctx:"Faute de moyens, le projet a été revu à la baisse.",ask:"What happened?",options:["It was scaled down for lack of resources","It was expanded thanks to new resources","It was delayed, but its budget stayed the same","It lost its resources after being scaled down"],answer:"It was scaled down for lack of resources"},
{id:"b2r9",aspect:"reading",format:"mcq",instr:"Read this extract.",ctx:"Les résultats sont en deçà des attentes, et de loin.",ask:"What does this mean?",options:["The results are well below expectations","The results are only slightly below expectations","The results are well above expectations","Expectations were far too low from the start"],answer:"The results are well below expectations"},
{id:"b2r10",aspect:"reading",format:"mcq",instr:"Read this extract.",ctx:"Si tant est que l'on puisse parler de réussite, celle-ci reste bien fragile.",ask:"What is the writer's attitude?",options:["Doubtful that it can even be called a success","Convinced it is a fragile but real success","Certain that it is an outright failure","Confident the success will soon get stronger"],answer:"Doubtful that it can even be called a success"},

{id:"b2u1",aspect:"usage",format:"mcq",instr:"In a professional email, which formulation is the most diplomatic?",options:["Je me permets de revenir vers vous à ce sujet.","Je vous rappelle que j'attends toujours votre réponse.","Auriez-vous l'amabilité de répondre enfin à mon message ?","Je me permets d'exiger une réponse rapide de votre part."],answer:"Je me permets de revenir vers vous à ce sujet."},
{id:"b2u2",aspect:"usage",format:"mcq",instr:"Which sentence belongs to spoken, informal French?",options:["Bref, on a laissé tomber.","En conséquence, le projet a été abandonné.","Il convient de renoncer au projet.","Le projet fut abandonné."],answer:"Bref, on a laissé tomber."},
{id:"b2u3",aspect:"usage",format:"mcq",instr:"You want to express a strong reservation without being rude. Which one?",options:["Je reste assez réservé sur ce point.","Franchement, je n'y crois pas une seconde.","Ce point ne mérite pas qu'on s'y attarde.","Je partage entièrement votre enthousiasme."],answer:"Je reste assez réservé sur ce point."},
{id:"b2u4",aspect:"usage",format:"mcq",instr:"What does « ça ne mange pas de pain » mean?",options:["It costs nothing to try","It is very expensive","It is forbidden","It is delicious"],answer:"It costs nothing to try"},
{id:"b2u5",aspect:"usage",format:"mcq",instr:"Which sentence concedes a point before objecting?",options:["Je vous rejoins sur ce point, cela étant…","Je vous arrête tout de suite, c'est inexact.","C'est un point de détail, passons à l'essentiel.","Vous soulevez une question, j'y répondrai plus tard."],answer:"Je vous rejoins sur ce point, cela étant…"},
{id:"b2u6",aspect:"usage",format:"mcq",instr:"In a debate, you reformulate the other person's point before answering. Which one?",options:["Si je vous suis bien, vous dites que…","Comme je le disais avant d'être interrompu…","Là n'est pas la question, revenons au sujet.","Chacun aura compris ce que vous vouliez dire."],answer:"Si je vous suis bien, vous dites que…"},
{id:"b2u7",aspect:"usage",format:"mcq",instr:"Which is the most diplomatic refusal at work?",options:["Je crains de ne pas pouvoir m'engager sur ce délai.","Je vous confirme que ce délai ne me concerne pas.","Ce délai me semble parfaitement réalisable.","Il est hors de question que je m'engage là-dessus."],answer:"Je crains de ne pas pouvoir m'engager sur ce délai."},
{id:"b2u8",aspect:"usage",format:"mcq",instr:"What does « ne pas y aller de main morte » mean?",options:["To act very forcefully","To be extremely gentle","To arrive late","To give up quickly"],answer:"To act very forcefully"},
{id:"b2u9",aspect:"usage",format:"mcq",instr:"Which sentence expresses a cautious hypothesis?",options:["Il se pourrait bien que la situation évolue.","La situation évolue.","La situation a évolué.","La situation n'évolue pas."],answer:"Il se pourrait bien que la situation évolue."},
{id:"b2u10",aspect:"usage",format:"mcq",instr:"Which formulation would NOT be acceptable in a formal written report?",options:["Il faut bien avouer qu'on a eu chaud.","Il convient de rappeler les faits.","Force est de constater que les résultats progressent.","Il importe de souligner ce point."],answer:"Il faut bien avouer qu'on a eu chaud."},

{id:"b2s1",aspect:"structure",format:"order",instr:"Put the words in the correct order.",tokens:["Non","seulement","il","a","accepté","mais","il","a","insisté"],answers:["Non seulement il a accepté mais il a insisté"]},
{id:"b2s2",aspect:"structure",format:"mcq",instr:"What does this sentence structure express?",stem:"À peine était-il arrivé qu'on lui annonça la nouvelle.",options:["Immediate succession of two events","A condition","A comparison","A repeated habit"],answer:"Immediate succession of two events"},
{id:"b2s3",aspect:"structure",format:"mcq",instr:"Which sentence is in the passive voice?",options:["La décision a été prise hier.","Il a pris la décision hier.","Il décidera demain.","La décision lui appartient."],answer:"La décision a été prise hier."},
{id:"b2s4",aspect:"structure",format:"order",instr:"Put the words in the correct order.",tokens:["Quitte","à","me","répéter","j'insiste"],answers:["Quitte à me répéter j'insiste"]},
{id:"b2s5",aspect:"structure",format:"mcq",instr:"In this sentence, what is « dont » referring to?",stem:"Un projet dont les conséquences restent incertaines.",options:["The project","The consequences","Nothing specific","The author"],answer:"The project"},
{id:"b2s6",aspect:"structure",format:"order",instr:"Put the words in the correct order.",tokens:["Aussi","surprenant","que","cela","puisse","paraître","c'est","vrai"],answers:["Aussi surprenant que cela puisse paraître c'est vrai"]},
{id:"b2s7",aspect:"structure",format:"mcq",instr:"What does this structure express?",stem:"N'eût-il pas insisté, rien n'aurait changé.",options:["An unreal condition in the past","A future plan","A simple negation","A polite request"],answer:"An unreal condition in the past"},
{id:"b2s8",aspect:"structure",format:"order",instr:"Put the words in the correct order (a well-known proverb).",tokens:["C'est","en","forgeant","que","l'on","devient","forgeron"],answers:["C'est en forgeant que l'on devient forgeron"]},
{id:"b2s9",aspect:"structure",format:"mcq",instr:"What does this sentence add to what was just said?",stem:"Encore faut-il que les moyens suivent.",options:["A restrictive condition (\"but only if…\")","A simple question","A direct order","A comparison"],answer:"A restrictive condition (\"but only if…\")"},
{id:"b2s10",aspect:"structure",format:"order",instr:"Put the words in the correct order.",tokens:["Non","content","d'avoir","gagné","il","a","battu","le","record"],answers:["Non content d'avoir gagné il a battu le record"]}
]
};
</script>
<script>
(function(){
"use strict";
/* ---- Links to fill in (leave empty to show a text pointer instead) ---- */
var CONFIG={consultationUrl:"https://calendar.app.google/LbtdS1yiRzXGRLUc6",kofiUrl:"https://ko-fi.com/s/701ae87edb"};

var LEVELS=["A1","A2","B1","B2"];
var ICONS=["\uD83C\uDF31","\uD83C\uDF3F","\uD83C\uDF33","\u2B50"];
var ASPECTS=["vocab","grammar","reading","usage","structure"];
var ASPECT_LABEL={vocab:"Vocabulary",grammar:"Grammar",reading:"Reading",usage:"Real-life French",structure:"Sentence structure"};
var KEY="fv_level_test_seen_v1";
var DUNNO="\uD83E\uDD37 I don\u2019t know yet";

var screenEl=document.getElementById("screen");
var trackerEl=document.getElementById("tracker");
var pathEl=document.getElementById("pathwrap");
var miniEl=document.getElementById("mini");
var metaEl=document.getElementById("stagemeta");

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function norm(s){return (s==null?"":String(s)).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[\u2019\u02bc\u00b4]/g,"'").replace(/[.,!?;:\u00ab\u00bb"\u2026]/g,"").replace(/\s+/g," ").trim()}
function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function gap(s){return esc(s).replace(/___/g,'<span class="gap">___</span>')}
function loadSeen(){try{var v=JSON.parse(localStorage.getItem(KEY));return (v&&typeof v==="object")?v:{}}catch(e){return{}}}
function saveSeen(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}

var S={seen:loadSeen(),start:0,stage:0,qs:[],qi:0,correct:0,unknown:0,dots:[],passed:[],failed:{},done:false,result:null};

function initDots(start){S.dots=[];for(var i=0;i<4;i++){var row=[];for(var j=0;j<10;j++){row.push(i<start?"skip":"todo")}S.dots.push(row)}}

/* ---------- progress path ---------- */
var P=[[46,166],[286,74],[520,166],[752,74],[958,166]];
var TENSION=0.2;
function cps(i){
  var p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||P[i+1];
  return [[p1[0]+(p2[0]-p0[0])*TENSION,p1[1]+(p2[1]-p0[1])*TENSION],
          [p2[0]-(p3[0]-p1[0])*TENSION,p2[1]-(p3[1]-p1[1])*TENSION]];
}
function cpt(i,t){
  var p1=P[i],p2=P[i+1],c=cps(i),c1=c[0],c2=c[1],u=1-t;
  return [u*u*u*p1[0]+3*u*u*t*c1[0]+3*u*t*t*c2[0]+t*t*t*p2[0],
          u*u*u*p1[1]+3*u*u*t*c1[1]+3*u*t*t*c2[1]+t*t*t*p2[1]];
}

function drawPath(){
  var s='<svg viewBox="0 0 1000 215" role="img" aria-label="Your progress through the levels">';
  var i,j;
  for(i=0;i<4;i++){
    var c=cps(i),cls="seg";
    if(S.passed[i])cls+=" done";else if(i===S.stage&&!S.done)cls+=" now";else if(i<S.start&&S.dots[i][0]==="skip")cls+=" skip";
    s+='<path class="'+cls+'" d="M'+P[i][0]+' '+P[i][1]+' C'+c[0][0].toFixed(1)+' '+c[0][1].toFixed(1)+' '+c[1][0].toFixed(1)+' '+c[1][1].toFixed(1)+' '+P[i+1][0]+' '+P[i+1][1]+'"/>';
  }
  s+='<circle class="dot" cx="'+P[0][0]+'" cy="'+P[0][1]+'" r="8"/>';
  s+='<text class="startlab" x="'+P[0][0]+'" y="'+(P[0][1]+30)+'">Start</text>';
  for(i=0;i<4;i++){
    for(j=0;j<10;j++){
      var pt=cpt(i,(j+1)/11),st=S.dots[i][j],dc="dot";
      if(st==="done")dc+=" done";else if(st==="skip")dc+=" skip";else if(st==="current")dc+=" cur";
      if(st==="current"){s+='<circle class="ring" cx="'+pt[0].toFixed(1)+'" cy="'+pt[1].toFixed(1)+'" r="9.4"/>'}
      s+='<circle class="'+dc+'" cx="'+pt[0].toFixed(1)+'" cy="'+pt[1].toFixed(1)+'" r="5.2"/>';
    }
  }
  for(i=0;i<4;i++){
    var p=P[i+1],mc="ms",lc="mslab";
    if(S.passed[i]){mc+=" done";lc+=" done"}else if(i===S.stage&&!S.done){mc+=" now";lc+=" now"}
    s+='<circle class="'+mc+'" cx="'+p[0]+'" cy="'+p[1]+'" r="19"/>';
    s+='<text class="msicon" x="'+p[0]+'" y="'+(p[1]+1)+'">'+ICONS[i]+'</text>';
    s+='<text class="'+lc+'" x="'+p[0]+'" y="'+(p[1]<120?p[1]-29:p[1]+37)+'">'+LEVELS[i]+'</text>';
  }
  s+='</svg>';
  pathEl.innerHTML=s;

  var m="",k;
  for(k=0;k<4;k++){
    var c2="mstone"+(S.passed[k]?" done":((k===S.stage&&!S.done)?" now":""));
    m+='<span class="'+c2+'">'+ICONS[k]+' '+LEVELS[k]+'</span>';
  }
  var cur=S.dots[Math.min(S.stage,3)]||[];
  m+='<span class="mdots">'+cur.map(function(st){return '<span class="mdot'+(st==="done"?" done":(st==="current"?" now":""))+'"></span>'}).join("")+'</span>';
  miniEl.innerHTML=m;
}
function showTracker(){trackerEl.hidden=false;drawPath()}

/* ---------- question selection (no repeats across 5 rounds) ---------- */
function pickStage(level){
  if(!Array.isArray(S.seen[level]))S.seen[level]=[];
  var byA={};
  BANK[level].forEach(function(q){(byA[q.aspect]=byA[q.aspect]||[]).push(q)});
  var out=[];
  ASPECTS.forEach(function(a){
    var pool=byA[a]||[];if(!pool.length)return;
    var avail=pool.filter(function(q){return S.seen[level].indexOf(q.id)<0});
    var take=shuffle(avail).slice(0,2);
    if(take.length<2){
      var ids=pool.map(function(q){return q.id});
      S.seen[level]=S.seen[level].filter(function(id){return ids.indexOf(id)<0});
      var rest=shuffle(pool.filter(function(q){return take.indexOf(q)<0}));
      take=take.concat(rest.slice(0,2-take.length));
    }
    take.forEach(function(q){S.seen[level].push(q.id);out.push(q)});
  });
  saveSeen(S.seen);
  return shuffle(out);
}

/* ---------- screens ---------- */
function intro(){
  trackerEl.hidden=true;
  screenEl.innerHTML='<h1>What\u2019s my French level? \uD83E\uDDED</h1>'+
  '<p class="lead">No sign-up, no email, no score to be ashamed of. The questions adapt to you, so you never have to guess.</p>'+
  '<ul class="chips"><li class="chip">\u23F1\uFE0F 4\u201310 minutes</li><li class="chip">\uD83E\uDDED 10 to 40 questions</li><li class="chip">\uD83E\uDD37 \u00ab I don\u2019t know \u00bb is always allowed</li><li class="chip">\uD83C\uDD95 New questions every time</li></ul>'+
  '<p class="ask">First, one question in English. It only tells me where to start, it is not part of your score.</p>'+
  '<p class="instr">How much French have you studied so far?</p>'+
  '<div class="opts" id="route"></div>';
  var routes=[["Never, I\u2019m starting from zero","zero"],["A few weeks","w"],["A few months","m"],["1 to 2 years","y"],["More than 2 years","p"]];
  var box=document.getElementById("route");
  routes.forEach(function(r,i){
    var b=document.createElement("button");
    b.type="button";b.className="opt";
    b.innerHTML='<span class="k">'+(i+1)+'</span><span>'+esc(r[0])+'</span>';
    b.addEventListener("click",function(){route(r[1])});
    box.appendChild(b);
  });
}

function route(code){
  if(code==="zero"){S.start=0;S.stage=0;initDots(0);S.done=true;S.result="A0";showTracker();metaEl.textContent="Your starting point";result();return}
  var start=(code==="y")?1:(code==="p")?2:0;
  S.start=start;S.stage=start;S.passed=[];S.failed={};S.done=false;initDots(start);
  startStage();
}

function startStage(){
  S.qs=pickStage(LEVELS[S.stage]);S.qi=0;S.correct=0;S.unknown=0;
  for(var j=0;j<10;j++){S.dots[S.stage][j]="todo"}
  showTracker();renderQ();
}

function renderQ(){
  var q=S.qs[S.qi];
  for(var j=0;j<10;j++){S.dots[S.stage][j]=(j<S.qi)?"done":(j===S.qi?"current":"todo")}
  showTracker();
  metaEl.textContent="Stage "+(S.stage+1)+" of 4 \u00b7 "+LEVELS[S.stage]+" level \u00b7 Question "+(S.qi+1)+" of 10";
  var h='<p class="qmeta">'+esc(ASPECT_LABEL[q.aspect]||"")+'</p>';
  h+='<p class="instr">'+esc(q.instr)+'</p>';
  if(q.ctx)h+='<div class="ctx">'+esc(q.ctx)+'</div>';
  if(q.stem)h+='<p class="stem">'+gap(q.stem)+'</p>';
  if(q.ask)h+='<p class="ask">'+esc(q.ask)+'</p>';
  if(q.format==="mcq"){
    h+='<div class="opts" id="opts"></div><button type="button" class="dunno" id="dunno">'+DUNNO+'</button>';
    screenEl.innerHTML=h;
    var box=document.getElementById("opts");
    shuffle(q.options).forEach(function(o,i){
      var b=document.createElement("button");b.type="button";b.className="opt";
      b.innerHTML='<span class="k">'+"ABCD".charAt(i)+'</span><span>'+esc(o)+'</span>';
      b.addEventListener("click",function(){b.classList.add("sel");setTimeout(function(){answer(norm(o)===norm(q.answer),false)},170)});
      box.appendChild(b);
    });
  }else if(q.format==="type"){
    h+='<label class="instr" for="ti">Your answer</label><input type="text" id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type in French\u2026">'+
      '<div class="row"><button type="button" class="btn" id="go">Continue \u2192</button></div>'+
      '<p class="hint">\u2728 Accents are optional. <em>ecoute</em> is accepted for <em>\u00e9coute</em>.</p>'+
      '<button type="button" class="dunno" id="dunno">'+DUNNO+'</button>';
    screenEl.innerHTML=h;
    var inp=document.getElementById("ti");
    var submit=function(){
      var v=norm(inp.value);
      if(!v){inp.focus();return}
      var ok=(q.accept||[]).some(function(a){return norm(a)===v});
      answer(ok,false);
    };
    document.getElementById("go").addEventListener("click",submit);
    inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();submit()}});
    inp.focus();
  }else{
    h+='<div class="build" id="build"><span class="ph">Tap the words in the right order\u2026</span></div>'+
      '<div class="tokens" id="toks"></div>'+
      '<div class="row"><button type="button" class="btn" id="go">Continue \u2192</button>'+
      '<button type="button" class="btn ghost" id="clr">Clear</button></div>'+
      '<p class="hint" id="omsg">No need to add any punctuation.</p>'+
      '<button type="button" class="dunno" id="dunno">'+DUNNO+'</button>';
    screenEl.innerHTML=h;
    var build=document.getElementById("build"),toks=document.getElementById("toks"),chosen=[];
    var refresh=function(){
      if(!chosen.length){build.innerHTML='<span class="ph">Tap the words in the right order\u2026</span>'}
      else{
        build.innerHTML="";
        chosen.forEach(function(c,i){
          var b=document.createElement("button");b.type="button";b.className="bt";b.textContent=c.word;
          b.setAttribute("aria-label","Remove "+c.word);
          b.addEventListener("click",function(){c.el.disabled=false;chosen.splice(i,1);refresh()});
          build.appendChild(b);
        });
      }
    };
    shuffle(q.tokens).forEach(function(w){
      var b=document.createElement("button");b.type="button";b.className="tok";b.textContent=w;
      b.addEventListener("click",function(){b.disabled=true;chosen.push({word:w,el:b});refresh()});
      toks.appendChild(b);
    });
    document.getElementById("clr").addEventListener("click",function(){
      chosen.forEach(function(c){c.el.disabled=false});chosen=[];refresh();
    });
    document.getElementById("go").addEventListener("click",function(){
      if(chosen.length<q.tokens.length){document.getElementById("omsg").textContent="\u26A0\uFE0F Place all the words first, then continue.";return}
      var built=norm(chosen.map(function(c){return c.word}).join(" "));
      var ok=(q.answers||[]).some(function(a){return norm(a)===built});
      answer(ok,false);
    });
  }
  document.getElementById("dunno").addEventListener("click",function(){answer(false,true)});
  if(window.scrollY>0)window.scrollTo({top:0,behavior:"smooth"});
}

function answer(ok,unknown){
  if(unknown){S.unknown++}else if(ok){S.correct++}
  S.dots[S.stage][S.qi]="done";
  if(S.unknown>=5){return endStage(true)}
  S.qi++;
  var left=10-S.qi;
  if(S.qi>=10){return endStage(false)}
  if(S.correct>=8){return endStage(false)}
  if(S.correct+left<6){return endStage(false)}
  if(S.correct>=6&&S.correct+left<8){return endStage(false)}
  renderQ();
}

function finish(code){S.done=true;S.result=code;drawPath();result()}

function endStage(tooManyUnknown){
  if(!tooManyUnknown&&S.correct>=8){
    S.passed[S.stage]=true;
    if(S.stage===3){return finish("B2+")}
    if(S.failed[S.stage+1]){return finish(LEVELS[S.stage])}
    drawPath();return celebrate();
  }
  if(!tooManyUnknown&&S.correct>=6){return finish(LEVELS[S.stage]+"-")}
  if(S.stage>0&&S.stage<=S.start){return stepdown()}
  return finish(S.stage===0?"A0":LEVELS[S.stage-1]);
}

function stepdown(){
  S.failed[S.stage]=true;
  var from=LEVELS[S.stage];
  S.stage--;
  drawPath();
  metaEl.textContent=from+" not confirmed yet";
  screenEl.innerHTML='<div class="celebrate"><p class="big">\uD83E\uDDED</p>'+
    '<h1>Let\u2019s check '+LEVELS[S.stage]+'</h1>'+
    '<p class="lead">'+from+' was a stretch today, and that is completely fine: it tells us exactly where to look. To give you an accurate result, let\u2019s confirm the level below. \u00ab I don\u2019t know \u00bb is still always allowed.</p>'+
    '<button type="button" class="btn" id="cont">Continue \u2192</button></div>';
  document.getElementById("cont").addEventListener("click",function(){startStage()});
}

function celebrate(){
  metaEl.textContent=LEVELS[S.stage]+" checkpoint reached";
  screenEl.innerHTML='<div class="celebrate"><p class="big">'+ICONS[S.stage]+'</p>'+
    '<h1>'+LEVELS[S.stage]+' unlocked!</h1>'+
    '<p class="lead">That level looks solid. \uD83D\uDC4F The next questions get harder, so answer honestly and use \u00ab I don\u2019t know \u00bb whenever you are unsure. Guessing only gives you a wrong result.</p>'+
    '<button type="button" class="btn" id="cont">Keep climbing \u2192</button></div>';
  document.getElementById("cont").addEventListener("click",function(){S.stage++;startStage()});
}

"A1-":{badge:"A0+ \u00b7 Almost A1",title:"You have the first bricks. They just aren\u2019t automatic yet \uD83C\uDF31",lead:"You recognised part of the basics, but you still have to think before every sentence. What you need now is repetition and speaking time, not new grammar.",work:["Present tense of the most common verbs","Simple questions: o\u00f9 ? combien ? comment ?","Numbers, prices and telling the time","Pronunciation: the sounds that don\u2019t exist in English"],next:function(){return["<strong>Beginner Course</strong>: we consolidate A1 with the Alter Ego +1 method.","For daily self-practice: "+kofi()+"."]}},

"A2":{badge:"A2 \u00b7 Everyday French",title:"You can talk about your everyday life \uD83C\uDF33",lead:"You handle the past, the near future and everyday situations. Now the goal changes: giving opinions, explaining, and reacting without translating in your head.",work:["Giving and justifying an opinion","Relative pronouns (qui, que, dont) for longer sentences","Subjunctive: the first useful cases","Listening to podcasts made for learners"],next:function(){return["<strong>Intermediate Levels</strong>, then <strong>Exam Prep</strong> if you want to aim for the DELF B1."]}},

  var btn=CONFIG.consultationUrl
    ?'<a class="btn" href="'+CONFIG.consultationUrl+'" target="_blank" rel="noopener">Book your free French consultation \u2192</a>'
    :'<p class="note"><strong>\uD83D\uDC47 Use the \u00ab Book your free French consultation \u00bb button on this page.</strong></p>';

    '<p>A free 20-minute chat on Google Meet with me, Anthony \uD83D\uDC4B I ask you a few simple questions, in English and in French, and you leave with clear recommendations: what to work on first, which resources suit you, and what a realistic plan looks like.</p>'+
    '<p>If it feels like a good fit, we can also plan a few 1-on-1 lessons focused on the areas you want to improve. No preparation needed, and no obligation to book.</p>'+btn+'</div>';
}

function result(){
  var r=RESULTS[S.result]||RESULTS["A0"];
  var recap=LEVELS.map(function(l,i){
    if(S.passed[i])return "\u2705 "+l;
    if(i<S.start&&S.dots[i][0]==="skip")return "\u2013 "+l;
    return "\u25FB\uFE0F "+l;
  }).join("  \u00b7  ");
  metaEl.textContent="Your result";
  var h='<span class="badge">'+esc(r.badge)+'</span>'+
    '<h2 class="rtitle">'+r.title+'</h2>'+
    '<p class="lead">'+r.lead+'</p>'+
    '<div class="panel"><h3>What to work on next</h3><ul>'+r.work.map(function(w){return '<li>'+w+'</li>'}).join("")+'</ul></div>'+
    '<div class="panel"><h3>Where to start on this site</h3><ul>'+r.next().map(function(n){return '<li>'+n+'</li>'}).join("")+'</ul></div>'+
    ctaBlock()+
    '<p class="note">Checkpoints: '+recap+'</p>';
  if(S.start>0&&!S.passed[S.start]){
    h+='<p class="note">\u2139\uFE0F We started you at '+LEVELS[S.start]+' based on your first answer. That level was not confirmed today, so the test automatically checked the level below: your result only counts questions you actually answered.</p>';
  }
  h+='<div class="row"><button type="button" class="btn secondary" id="again">Take the test again \u2192</button></div>'+
    '<p class="note" style="margin-top:10px">This test never asks you the same questions twice: there are 5 complete rounds of fresh questions.</p>';
  screenEl.innerHTML=h;
  document.getElementById("again").addEventListener("click",function(){
    S.start=0;S.stage=0;S.qs=[];S.qi=0;S.correct=0;S.unknown=0;S.passed=[];S.failed={};S.done=false;S.result=null;initDots(0);intro();
  });
}

/* ---------- QA hooks (screenshots only) ---------- */
function dz(){var a=[],i;for(i=0;i<10;i++)a.push("done");return a}
var dbg=(location.search.match(/debug=([a-z0-9+-]+)/i)||[])[1];
initDots(0);
if(dbg){
  var forceQ=function(level,fmt,stage){
    S.start=0;S.stage=stage||0;S.passed=[];S.done=false;initDots(0);
    for(var i=0;i<(stage||0);i++){S.passed[i]=true}
    S.qs=BANK[level].filter(function(q){return q.format===fmt});S.qi=0;showTracker();renderQ();
  };
  if(dbg==="mcq")forceQ("A1","mcq",0);
  else if(dbg==="reading")forceQ("B2","mcq",2);
  else if(dbg==="type")forceQ("A2","type",1);
  else if(dbg==="order")forceQ("B1","order",2);
  else if(dbg==="stage"){S.stage=1;S.passed=[true,true];initDots(0);S.dots[0]=dz();S.dots[1]=dz();showTracker();celebrate()}
  else if(dbg==="result"){S.stage=2;S.passed=[true,true];initDots(0);S.dots[0]=dz();S.dots[1]=dz();S.dots[2]=dz();S.done=true;S.result="B1-";showTracker();result()}
  else if(dbg==="a0"){S.done=true;S.result="A0";showTracker();result()}
  else intro();
}else{intro()}
})();
